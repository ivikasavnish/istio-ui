apiVersion: v1
kind: Namespace
metadata:
  name: meshcontrol
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshcontrol
  namespace: meshcontrol
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meshcontrol
rules:
- apiGroups: [""]
  resources: ["services", "pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.istio.io"]
  resources: ["virtualservices", "destinationrules", "gateways", "serviceentries"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["security.istio.io"]
  resources: ["peerauthentications", "authorizationpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meshcontrol
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meshcontrol
subjects:
- kind: ServiceAccount
  name: meshcontrol
  namespace: meshcontrol
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meshcontrol-data
  namespace: meshcontrol
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcontrol
  namespace: meshcontrol
  labels:
    app: meshcontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshcontrol
  template:
    metadata:
      labels:
        app: meshcontrol
    spec:
      serviceAccountName: meshcontrol
      containers:
      - name: meshcontrol
        image: meshcontrol:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: DB_PATH
          value: "/data/meshcontrol.db"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: meshcontrol-data
---
apiVersion: v1
kind: Service
metadata:
  name: meshcontrol
  namespace: meshcontrol
  labels:
    app: meshcontrol
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: meshcontrol
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meshcontrol
  namespace: meshcontrol
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: meshcontrol.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: meshcontrol
            port:
              number: 80
