---
apiVersion: v1
kind: Namespace
metadata:
  name: meshcontrol-center
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: meshcontrol-backend
  namespace: meshcontrol-center
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meshcontrol-backend
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules", "gateways", "serviceentries"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications", "requestauthentications"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meshcontrol-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meshcontrol-backend
subjects:
  - kind: ServiceAccount
    name: meshcontrol-backend
    namespace: meshcontrol-center
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcontrol-backend
  namespace: meshcontrol-center
  labels:
    app: meshcontrol-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshcontrol-backend
  template:
    metadata:
      labels:
        app: meshcontrol-backend
    spec:
      serviceAccountName: meshcontrol-backend
      containers:
        - name: backend
          image: meshcontrol-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: ENABLE_CORS
              value: "true"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: meshcontrol-backend
  namespace: meshcontrol-center
  labels:
    app: meshcontrol-backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: meshcontrol-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshcontrol-frontend
  namespace: meshcontrol-center
  labels:
    app: meshcontrol-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshcontrol-frontend
  template:
    metadata:
      labels:
        app: meshcontrol-frontend
    spec:
      containers:
        - name: frontend
          image: meshcontrol-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: meshcontrol-frontend
  namespace: meshcontrol-center
  labels:
    app: meshcontrol-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: meshcontrol-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meshcontrol-ingress
  namespace: meshcontrol-center
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: meshcontrol.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: meshcontrol-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meshcontrol-frontend
                port:
                  number: 80
